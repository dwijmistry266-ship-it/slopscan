<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0620"/>
      <stop offset="0.65" stop-color="#1b0b3a"/>
      <stop offset="1" stop-color="#2b0f45"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd319"/>
      <stop offset="0.55" stop-color="#ff2975"/>
      <stop offset="1" stop-color="#8c1eff"/>
    </linearGradient>
    <linearGradient id="gridfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2975" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff2975" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="80" cy="40" r="1.6"/><circle cx="210" cy="90" r="1.2"/>
    <circle cx="340" cy="35" r="1.8"/><circle cx="470" cy="70" r="1.1"/>
    <circle cx="620" cy="30" r="1.5"/><circle cx="760" cy="80" r="1.2"/>
    <circle cx="900" cy="40" r="1.7"/><circle cx="1040" cy="95" r="1.2"/>
    <circle cx="1130" cy="45" r="1.5"/><circle cx="150" cy="140" r="1.1"/>
    <circle cx="1080" cy="150" r="1.3"/>
  </g>

  <!-- synthwave sun -->
  <g>
    <circle cx="600" cy="215" r="105" fill="url(#sun)"/>
    <g fill="#0b0620">
      <rect x="492" y="196" width="216" height="7"/>
      <rect x="492" y="212" width="216" height="9"/>
      <rect x="492" y="230" width="216" height="11"/>
      <rect x="492" y="250" width="216" height="13"/>
      <rect x="492" y="272" width="216" height="15"/>
    </g>
  </g>

  <!-- perspective grid -->
  <g stroke="url(#gridfade)" stroke-width="2" opacity="0.85">
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="322" x2="1200" y2="322" opacity="0.7"/>
    <line x1="0" y1="350" x2="1200" y2="350" opacity="0.5"/>
    <line x1="0" y1="384" x2="1200" y2="384" opacity="0.3"/>
    <line x1="600" y1="300" x2="600" y2="400"/>
    <line x1="600" y1="300" x2="240" y2="400" opacity="0.8"/>
    <line x1="600" y1="300" x2="960" y2="400" opacity="0.8"/>
    <line x1="600" y1="300" x2="60" y2="400" opacity="0.55"/>
    <line x1="600" y1="300" x2="1140" y2="400" opacity="0.55"/>
    <line x1="600" y1="300" x2="420" y2="400" opacity="0.8"/>
    <line x1="600" y1="300" x2="780" y2="400" opacity="0.8"/>
  </g>

  <!-- scanline sweep -->
  <rect x="0" y="120" width="1200" height="3" fill="#00e5ff" opacity="0.5" filter="url(#glow)"/>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="92" font-weight="bold" letter-spacing="14" fill="#00e5ff"
        filter="url(#glow)">SLOPSCAN</text>
  <text x="600" y="352" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="26" letter-spacing="6" fill="#ff2975" opacity="0.95">AI SLOP DETECTOR FOR YOUR CODEBASE</text>
</svg>
